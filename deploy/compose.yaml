name: pinjia
services:
  web:
    image: pinjia:${RELEASE:?Set RELEASE}
    restart: unless-stopped
    env_file:
      - path: ${DEPLOY_ROOT:?Set DEPLOY_ROOT}/shared/production.env
        format: raw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_MEDIA_ROOT: /data/private-media
      DJANGO_TRUST_PROXY_HTTPS: "true"
    volumes:
      - ${DEPLOY_ROOT}/shared/data:/data
      - static:/app/staticfiles
      - ${DEPLOY_ROOT}/shared/secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  static:
  caddy_data:
  caddy_config:
